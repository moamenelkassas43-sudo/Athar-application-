<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أثر - تقديم المقترحات</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    .form-container h2 {
      margin-bottom: 20px;
      color: #2c3e50;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }
    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-group textarea {
      resize: vertical;
      height: 100px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #219150;
    }
    #status-message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>

<div class="form-container">
  <h2>شاركنا فكرتك 💡</h2>
  
  <form id="ideaForm" action="https://formspree.io/f/moamenelekassas43@gmail.com" method="POST">
    
    <div class="form-group">
      <label for="from_name">اسم الطالب</label>
      <input type="text" id="from_name" name="from_name" required placeholder="أدخل اسمك بالكامل">
    </div>

    <div class="form-group">
      <label for="gender">النوع</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>اختر النوع</option>
        <option value="ذكر">ذكر</option>
        <option value="أنثى">أنثى</option>
      </select>
    </div>

    <div class="form-group">
      <label for="district">الإدارة التعليمية</label>
      <input type="text" id="district" name="district" required placeholder="أدخل إدارتك التعليمية">
    </div>

    <div class="form-group">
      <label for="grade">الصف الدراسي</label>
      <input type="text" id="grade" name="grade" required placeholder="مثال: الصف الثاني الثانوي">
    </div>

    <div class="form-group">
      <label for="message">الفكرة / المقترح</label>
      <textarea id="message" name="message" required placeholder="اكتب تفاصيل فكرتك هنا..."></textarea>
    </div>

    <button type="submit" id="submitBtn">إرسال الفكرة</button>
  </form>

  <div id="status-message"></div>
</div>

<script>
  const form = document.getElementById('ideaForm');
  const statusMessage = document.getElementById('status-message');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري الإرسال...';
    statusMessage.style.display = 'none';

    const data = new FormData(form);

    try {
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      });

      if (response.ok) {
        statusMessage.className = 'success';
        statusMessage.innerText = 'تم إرسال فكرتك بنجاح! شكرًا لمشاركتك. ✨';
        statusMessage.style.display = 'block';
        form.reset();
      } else {
        throw new Error('حدث خطأ أثناء الإرسال');
      }
    } catch (error) {
      statusMessage.className = 'error';
      statusMessage.innerText = 'عذرًا، تعذر إرسال الرسالة. يرجى المحاولة لاحقًا.';
      statusMessage.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'إرسال الفكرة';
    }
  });
</script>

</body>
</html>
