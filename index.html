<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أثر - تقديم المقترحات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-card">
    
    <!-- قسم الهيدر والصورة الشخصية -->
    <div class="profile-header">
      <div class="avatar-container">
        <img src="profile.jpg" alt="الصورة الشخصية" class="profile-img">
      </div>
      <h2 class="title">منصة أثر 💡</h2>
      <p class="subtitle">شاركونا أفكاركم ومقترحاتكم لتطوير المبادرة</p>
    </div>

    <!-- النموذج -->
    <form id="atharForm" action="https://formspree.io/f/moamenelekassas43@gmail.com" method="POST">
      
      <div class="input-group">
        <label for="from_name">اسم الطالب</label>
        <input type="text" id="from_name" name="from_name" required placeholder="أدخل اسمك بالكامل">
      </div>

      <div class="input-group">
        <label for="gender">النوع</label>
        <select id="gender" name="gender" required>
          <option value="" disabled selected>اختر النوع</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>

      <div class="input-group">
        <label for="district">الإدارة التعليمية</label>
        <input type="text" id="district" name="district" required placeholder="أدخل إدارتك التعليمية">
      </div>

      <div class="input-group">
        <label for="grade">الصف الدراسي</label>
        <input type="text" id="grade" name="grade" required placeholder="مثال: الصف الثاني الثانوي">
      </div>

      <div class="input-group">
        <label for="message">الفكرة / المقترح</label>
        <textarea id="message" name="message" required placeholder="اكتب تفاصيل فكرتك هنا..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">إرسال الفكرة</button>
    </form>

    <!-- صندوق التنبيهات -->
    <div id="status-box"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
